server:
  servlet:
    session:
      cookie:
        name: BFFSESSIONID
  port: 8081

spring:
  application:
    name: oauth-bff

  security:
    oauth2:
      client:
        registration:
          bff-client:
            client-id: bff-client
            client-secret: bff-secret
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8081/login/oauth2/code/bff-client"
            scope: openid, profile, notes.read, notes.write
            client-name: POC Notas
            client-authentication-method: client_secret_basic

        provider:
          bff-client:
            issuer-uri: http://localhost:9001

logging:
  level:
    org.springframework.security: DEBUG
